name: Nintendo 3DS M13 build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  PB3DS_DOCKER_IMAGE: devkitpro/devkitarm
  PB3DS_DOCKER_DIGEST: sha256:15b79ce75822c289538d8153da5fa7aafe5e6adc32ad8a575a197beca0f0761b
  PB3DS_MAKEROM_COMMIT: e8f5f529c54ff9b22a2491a480ffa69206bf7b19

jobs:
  host-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Test M1 toolchain lock
        run: sh tools/test_m1.sh
      - name: Test M2 upstream lock
        run: PB3DS_VERIFY_UPSTREAM=1 sh tools/test_m2.sh
      - name: Test M0 bootstrap contract
        run: sh tools/test_bootstrap.sh
      - name: Test M3 platform contract
        run: sh tools/test_platform.sh
      - name: Test M4 diagnostics contract
        run: sh tools/test_m4.sh
      - name: Test M5 PaperBoat slice
        run: sh tools/test_m5.sh
      - name: Test M6 compatibility contract
        run: sh tools/test_m6.sh
      - name: Test M7 legal asset pipeline
        run: sh tools/test_m7.sh
      - name: Test M8 input contract
        run: sh tools/test_m8.sh
      - name: Test M9 filesystem contract
        run: sh tools/test_m9.sh
      - name: Test M10 loop contract
        run: sh tools/test_m10.sh
      - name: Test M11 gfx contract
        run: sh tools/test_m11.sh
      - name: Test M12 title contract
        run: sh tools/test_m12.sh
      - name: Test M13 runtime contract
        run: sh tools/test_m13.sh

  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm@sha256:15b79ce75822c289538d8153da5fa7aafe5e6adc32ad8a575a197beca0f0761b
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Record toolchain versions
        run: |
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version
          make --version
          cat toolchain/TOOLCHAINS.lock
      - name: Test M1 toolchain lock
        run: sh tools/test_m1.sh
      - name: Test M2 upstream lock
        run: sh tools/test_m2.sh
      - name: Test M0 bootstrap contract
        run: make bootstrap-test
      - name: Test M3 platform contract
        run: make m3-platform-test
      - name: Test M4 diagnostics contract
        run: make m4-diag-test
      - name: Fetch pinned PaperBoat slice
        run: make fetch
      - name: Test M5 PaperBoat slice
        run: make m5-slice-test
      - name: Test M6 compatibility contract
        run: make m6-compat-test
      - name: Test M7 legal asset pipeline
        run: make m7-assets-test
      - name: Test M8 input contract
        run: make m8-input-test
      - name: Test M9 filesystem contract
        run: make m9-fs-test
      - name: Test M10 loop contract
        run: make m10-loop-test
      - name: Test M11 gfx contract
        run: make m11-gfx-test
      - name: Test M12 title contract
        run: make m12-title-test
      - name: Test M13 runtime contract
        run: make m13-runtime-test
      - name: Build 3DSX
        run: |
          make -j2 \
            PB3DS_BUILD_SHA="$GITHUB_SHA" \
            PB3DS_BUILD_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Write build metadata
        run: |
          PB3DS_VERSION="$(awk '/^#define PB3DS_VERSION / { gsub(/"/, "", $3); print $3 }' include/pb3ds/version.h)" \
          PB3DS_BUILD_SHA="$GITHUB_SHA" \
          PB3DS_BUILD_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          PB3DS_DOCKER_IMAGE="$PB3DS_DOCKER_IMAGE" \
          PB3DS_DOCKER_DIGEST="$PB3DS_DOCKER_DIGEST" \
          PB3DS_MAKEROM_COMMIT="$PB3DS_MAKEROM_COMMIT" \
          sh tools/write_build_info.sh build/build-info.txt
          cat build/build-info.txt
      - name: Build pinned makerom
        run: |
          git clone https://github.com/3DSGuy/Project_CTR.git "$RUNNER_TEMP/Project_CTR"
          git -C "$RUNNER_TEMP/Project_CTR" checkout "$PB3DS_MAKEROM_COMMIT"
          make -C "$RUNNER_TEMP/Project_CTR/makerom" deps
          make -C "$RUNNER_TEMP/Project_CTR/makerom" -j2
          mkdir -p "$GITHUB_WORKSPACE/.tools"
          install -m 0755 "$RUNNER_TEMP/Project_CTR/makerom/bin/makerom" "$GITHUB_WORKSPACE/.tools/makerom"
      - name: Build CCI and CIA packages
        run: make MAKEROM="$GITHUB_WORKSPACE/.tools/makerom" packages
      - name: Verify expected outputs
        run: |
          test -s PaperBoat3DS-Refolded.elf
          test -s PaperBoat3DS-Refolded.3dsx
          test -s PaperBoat3DS-Refolded.3ds
          test -s PaperBoat3DS-Refolded.cia
          test -s build/build-info.txt
          grep -q "git_sha=$GITHUB_SHA" build/build-info.txt
      - name: Stage download zip
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          archive = Path("PaperBoat3DS-Refolded.zip")
          entries = (
              ("PaperBoat3DS-Refolded.3dsx", "PaperBoat3DS-Refolded.3dsx"),
              ("PaperBoat3DS-Refolded.3ds", "PaperBoat3DS-Refolded.3ds"),
              ("PaperBoat3DS-Refolded.cia", "PaperBoat3DS-Refolded.cia"),
              ("PaperBoat3DS-Refolded.smdh", "PaperBoat3DS-Refolded.smdh"),
              ("build/build-info.txt", "build-info.txt"),
          )
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as zf:
              for src, name in entries:
                  zf.write(src, arcname=name)
          if archive.stat().st_size < 1:
              raise SystemExit("empty zip")
          PY
          test -s PaperBoat3DS-Refolded.zip
      - name: Upload Homebrew artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PaperBoat3DS-Refolded
          if-no-files-found: error
          compression-level: 0
          path: |
            PaperBoat3DS-Refolded.zip
            PaperBoat3DS-Refolded.3dsx
            PaperBoat3DS-Refolded.3ds
            PaperBoat3DS-Refolded.cia
            PaperBoat3DS-Refolded.elf
            PaperBoat3DS-Refolded.smdh
            build/build-info.txt
          retention-days: 14
      - name: Publish packages on Releases
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: CI packages (latest)
          draft: false
          prerelease: true
          make_latest: false
          files: |
            PaperBoat3DS-Refolded.zip
            PaperBoat3DS-Refolded.3dsx
            PaperBoat3DS-Refolded.3ds
            PaperBoat3DS-Refolded.cia
          body: |
            Rolling CI packages from `${{ github.sha }}` (`${{ github.ref_name }}`).
            Use **Releases** if the Actions artifact download is missing on mobile.

            - Homebrew Launcher: `PaperBoat3DS-Refolded.3dsx`
            - Folium / CCI: `PaperBoat3DS-Refolded.3ds`
            - FBI: `PaperBoat3DS-Refolded.cia`
