name: Nintendo 3DS build

on:
  push:
    branches:
      - port/3ds
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Record toolchain versions
        run: |
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version
          make --version

      - name: Test M6 memory policy
        run: make m6-policy-test

      - name: Test M8 input backend
        run: make m8-input-test

      - name: Test M9 renderer contract
        run: make m9-renderer-test

      - name: Fetch pinned upstream sources
        run: sh tools/fetch_upstream.sh

      - name: Test M10 libultraship graphics contract
        run: make m10-graphics-test

      - name: Test M11 archive-backed frame
        run: make m11-frame-test

      - name: Cross-compile M5 upstream core slice
        run: make m5-core-check

      - name: Build 3DSX
        run: |
          make -j2 \
            PB3DS_BUILD_SHA="$GITHUB_SHA" \
            PB3DS_BUILD_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Enforce M6 static memory budgets
        run: make m6-budget-check

      - name: Build pinned makerom
        env:
          MAKEROM_COMMIT: e8f5f529c54ff9b22a2491a480ffa69206bf7b19
        run: |
          git clone https://github.com/3DSGuy/Project_CTR.git "$RUNNER_TEMP/Project_CTR"
          git -C "$RUNNER_TEMP/Project_CTR" checkout "$MAKEROM_COMMIT"
          make -C "$RUNNER_TEMP/Project_CTR/makerom" deps
          make -C "$RUNNER_TEMP/Project_CTR/makerom" -j2
          mkdir -p "$GITHUB_WORKSPACE/.tools"
          install -m 0755 "$RUNNER_TEMP/Project_CTR/makerom/bin/makerom" "$GITHUB_WORKSPACE/.tools/makerom"

      - name: Build emulator and installable packages
        run: make MAKEROM="$GITHUB_WORKSPACE/.tools/makerom" packages

      - name: Verify expected outputs
        run: |
          test -s PaperBoat3DS.elf
          test -s PaperBoat3DS.3dsx
          test -s PaperBoat3DS.3ds
          test -s PaperBoat3DS.cia

      - name: Upload build outputs
        uses: actions/upload-artifact@v6
        with:
          name: PaperBoat3DS-${{ github.sha }}
          if-no-files-found: error
          path: |
            PaperBoat3DS.elf
            PaperBoat3DS.3dsx
            PaperBoat3DS.3ds
            PaperBoat3DS.cia
            build/memory-budget.txt
          retention-days: 14
