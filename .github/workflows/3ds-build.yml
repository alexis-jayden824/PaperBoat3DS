name: Nintendo 3DS build

on:
  push:
    branches:
      - port/3ds
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Record toolchain versions
        run: |
          arm-none-eabi-gcc --version
          make --version

      - name: Build 3DSX
        run: make -j2

      - name: Verify expected outputs
        run: |
          test -s PaperBoat3DS.elf
          test -s PaperBoat3DS.3dsx

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: PaperBoat3DS-${{ github.sha }}
          if-no-files-found: error
          path: |
            PaperBoat3DS.elf
            PaperBoat3DS.3dsx
          retention-days: 14
