name: Nintendo 3DS buildon:  push:    branches:      - port/3ds  pull_request:  workflow_dispatch:permissions:  contents: readjobs:  build:    runs-on: ubuntu-latest    container:      image: devkitpro/devkitarm:latest    steps:      - name: Check out source        uses: actions/checkout@v5      - name: Record toolchain versions        run: |          "$DEVKITARM/bin/arm-none-eabi-gcc" --version          make --version      - name: Build 3DSX        run: make -j2      - name: Verify expected outputs        run: |          test -s PaperBoat3DS.elf          test -s PaperBoat3DS.3dsx      - name: Upload build outputs
