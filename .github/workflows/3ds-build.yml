name: Nintendo 3DS M13 gameplay build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  PB3DS_DOCKER_IMAGE: devkitpro/devkitarm
  PB3DS_DOCKER_DIGEST: sha256:15b79ce75822c289538d8153da5fa7aafe5e6adc32ad8a575a197beca0f0761b
  PB3DS_MAKEROM_COMMIT: e8f5f529c54ff9b22a2491a480ffa69206bf7b19

jobs:
  host-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Fetch pinned PaperBoat for host contracts
        run: sh tools/fetch_upstream.sh
      - name: Test synthetic asset pipeline
        run: sh tools/test_asset_pipeline.sh
      - name: Test host runtime contracts
        run: |
          HOST_CC=cc sh tools/test_memory_policy.sh build/host-m6
          HOST_CC=cc sh tools/test_input_backend.sh build/host-m8
          HOST_CC=cc sh tools/test_renderer_contract.sh build/host-m9
          HOST_CC=cc sh tools/test_gfx_bridge.sh build/host-m10-bridge
          HOST_CC=cc HOST_CXX=c++ sh tools/test_gfx_api_contract.sh build/host-m10-api
          HOST_CC=cc sh tools/test_first_frame.sh build/host-m11
          HOST_CC=cc sh tools/test_title_flow.sh build/host-m12-flow
          HOST_CC=cc sh tools/test_title_layout.sh build/host-m12-layout
          python3 tests/test_m13_runtime_generation.py \
            tools/generate_m13_runtime.py .cache/upstream/PaperBoat
          HOST_CC=cc sh tools/test_world_boot.sh build/host-m13-world
          HOST_CC=cc sh tools/test_world_scene.sh build/host-m13-scene
          SANITIZE=1 HOST_CC=cc sh tools/test_runtime_resources.sh \
            build/host-m13-resources

  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm@sha256:15b79ce75822c289538d8153da5fa7aafe5e6adc32ad8a575a197beca0f0761b
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Record toolchain versions
        run: |
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version
          make --version
          cat toolchain/TOOLCHAINS.lock
      - name: Fetch pinned PaperBoat
        run: make fetch-upstream
      - name: Run graphics and runtime contracts
        run: |
          SANITIZE=1 make m10-graphics-test
          make m11-frame-test
          make m12-flow-test
          make m12-layout-test
          make m13-world-test
          SANITIZE=1 sh tools/test_runtime_resources.sh
      - name: Cross-compile and verify PaperBoat runtime
        run: |
          make m5-core-check
          make m13-core-check
      - name: Build gameplay 3DSX
        run: |
          make -j2 \
            PB3DS_BUILD_SHA="$GITHUB_SHA" \
            PB3DS_BUILD_UTC="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          make m6-budget-check
      - name: Write build metadata
        run: |
          mkdir -p build
          cat > build/build-info.txt <<EOF
          version=$(awk '/^#define PB3DS_VERSION / { gsub(/"/, "", $3); print $3 }' include/pb3ds/version.h)
          git_sha=$GITHUB_SHA
          git_ref=$GITHUB_REF_NAME
          build_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          paperboat_commit=$(awk -F= '/^PAPERBOAT_COMMIT=/ { print $2 }' upstream/PAPERBOAT.lock)
          runtime=title-file-select-toad-town
          EOF
      - name: Build pinned makerom
        run: |
          git clone https://github.com/3DSGuy/Project_CTR.git "$RUNNER_TEMP/Project_CTR"
          git -C "$RUNNER_TEMP/Project_CTR" checkout "$PB3DS_MAKEROM_COMMIT"
          make -C "$RUNNER_TEMP/Project_CTR/makerom" deps
          make -C "$RUNNER_TEMP/Project_CTR/makerom" -j2
          mkdir -p "$GITHUB_WORKSPACE/.tools"
          install -m 0755 "$RUNNER_TEMP/Project_CTR/makerom/bin/makerom" "$GITHUB_WORKSPACE/.tools/makerom"
      - name: Build CCI and CIA packages
        run: make MAKEROM="$GITHUB_WORKSPACE/.tools/makerom" packages
      - name: Verify and stage outputs
        run: |
          test -s PaperBoat3DS-Refolded.elf
          test -s PaperBoat3DS-Refolded.3dsx
          test -s PaperBoat3DS-Refolded.3ds
          test -s PaperBoat3DS-Refolded.cia
          grep -q "git_sha=$GITHUB_SHA" build/build-info.txt
          python3 - <<'PYZIP'
          import zipfile
          from pathlib import Path
          archive = Path("PaperBoat3DS-Refolded.zip")
          entries = (
              "PaperBoat3DS-Refolded.3dsx",
              "PaperBoat3DS-Refolded.3ds",
              "PaperBoat3DS-Refolded.cia",
              "PaperBoat3DS-Refolded.smdh",
          )
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as zf:
              for source in entries:
                  zf.write(source)
              zf.write("build/build-info.txt", "build-info.txt")
          PYZIP
          cp PaperBoat3DS-Refolded.zip pb3ds.zip
      - name: Upload gameplay artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pb3ds
          if-no-files-found: error
          compression-level: 0
          path: pb3ds.zip
          retention-days: 14
      - name: Publish rolling gameplay packages
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-latest
          name: CI packages (latest)
          draft: false
          prerelease: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            pb3ds.zip
            PaperBoat3DS-Refolded.zip
            PaperBoat3DS-Refolded.3dsx
            PaperBoat3DS-Refolded.3ds
            PaperBoat3DS-Refolded.cia
          body: |
            Rolling M13 gameplay packages from `${{ github.sha }}` (`${{ github.ref_name }}`).

            Copy `PaperBoat3DS-Refolded.3dsx` to `/3ds/PaperBoat3DS/` and place
            the legally generated `paperboat.o2r` and `pm64.o2r` beside it.
